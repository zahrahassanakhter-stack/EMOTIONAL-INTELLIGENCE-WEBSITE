<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI quizes</title>
    <link rel="stylesheet" href="style.css">
     <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

<body>
    
       <!-- quiz -->

    <div id="quizez">
      <header>
        <div class="dbheading">
          <img
            src="images/logo.png"
            style="
              width: 80px;
              height: 50px;
              border-radius: 50%;
              border: 1px solid #085041;
            "
          />
          <h3>Emotional Intelligence</h3>
        </div>

        <div class="questioncount">
          <h3><span>0/</span>questions</h3>
          <div class="questionbar">
            <div class="fill"></div>
          </div>
        </div>
      </header>
      <!-- back btn -->
      <a href="dashboard.html"
        ><div class="backbtn"><img src="images/arrow.png" alt="" /></div
      ></a>

      <!-- content -->
      <div class="QuizContent">
        <h2>Emotional Intelligence Quiz</h2>

        <p>
          <b>Q1:</b> When I feel overwhelmed, I am aware of what is causing it.
        </p>

        <label><input type="radio" name="q1" /> Strongly Agree</label><br />
        <label><input type="radio" name="q1" /> Agree</label><br />
        <label><input type="radio" name="q1" /> Neutral</label><br />
        <label><input type="radio" name="q1" /> Disagree</label><br />
        <label><input type="radio" name="q1" /> Strongly Disagree</label><br />

        <br />

        <p>
          <b>Q2:</b> I can stay calm even in difficult or frustrating
          situations.
        </p>

        <label><input type="radio" name="q2" /> Strongly Agree</label><br />
        <label><input type="radio" name="q2" /> Agree</label><br />
        <label><input type="radio" name="q2" /> Neutral</label><br />
        <label><input type="radio" name="q2" /> Disagree</label><br />
        <label><input type="radio" name="q2" /> Strongly Disagree</label><br />

        <button class="btn">Next</button>
      </div>

</body>
</html>
