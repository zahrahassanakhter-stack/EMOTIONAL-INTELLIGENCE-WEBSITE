<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Activities</title>
     <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  
    <!--acitivites  -->
    <div id="Activities">
      <header>
        <div class="dbheading">
          <img
            src="images/logo.png"
            style="
              width: 80px;
              height: 50px;
              border-radius: 50%;
              border: 1px solid #085041;
            "
          />
          <h3>Emotional Intelligence</h3>
        </div>
        <h4>Progress completed:<span>0/5</span></h4>
      </header>
      <!-- back btn -->
      <a href="dashboard.html"
        ><div class="backbtn"><img src="images/arrow.png" alt="" /></div
      ></a>
      <!-- content -->
      <div class="ActivityContent">
        <h2>Daily Emotional Practice</h2>

        <p>
          Complete these real-life activities today. These are designed to
          improve your emotional intelligence through action, not just theory.
        </p>

        <div class="task">
          <input type="checkbox" />
          <label>
            Pause before reacting in a stressful situation and take 3 deep
            breaths.
          </label>
        </div>

        <div class="task">
          <input type="checkbox" />
          <label>
            Notice one emotion you felt today and write down what caused it.
          </label>
        </div>

        <div class="task">
          <input type="checkbox" />
          <label>
            Actively listen to someone without interrupting or judging.
          </label>
        </div>

        <div class="task">
          <input type="checkbox" />
          <label> Do one small act of kindness for someone. </label>
        </div>

        <div class="task">
          <input type="checkbox" />
          <label>
            Reflect on your day: What did you handle well emotionally?
          </label>
        </div>

        <button class="btn">Submit Today's Progress</button>
      </div>
    </div>
  </body>
</html>
