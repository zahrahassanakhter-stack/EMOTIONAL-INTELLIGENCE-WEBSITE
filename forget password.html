<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forget password</title>
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <header>
      <!-- header -->
      <div class="dbheading">
        <img src="images/logo.png" />
        <h3>EQ Lab</h3>
      </div>
      <div>
        <i class="fa-sharp fa-thin fa-lightbulb"></i>
      </div>
    </header>
    <!--forget form-->
    <form id="password-forget" class="forgetpassword">
      <h2 class="mainheadings">Forget your Password</h2>
      <p class="oneline-para">
        Please enter the email address you'd like your password reset
        information sent to
      </p>
      <label class="labels" for="email">Enter Email</label>
      <input
        class="entervalue"
        type="email"
        id="email"
        name="email"
        placeholder="Enter Email"
        required
      />
      <button class="allbuttons" type="submit">Send Reset OTP</button>
      <a class="links" href="login.html">Back TO Login</a>
    </form>
    <!-- otp sent -->
    <form id="OTPPAGE" class="forgetpassword">
      <h2 class="mainheadings" id="heading">Verify OTP</h2>
      <p id="para" class="oneline-para">
        We have sent a 6-digit code to your email
      </p>
      <label class="labels" id="label" for="email">Enter OTP</label>
      <div id="input_otp">
        <input class="digitbox" type="text" maxlength="1" />
        <input class="digitbox" type="text" maxlength="1" />
        <input class="digitbox" type="text" maxlength="1" />
        <input class="digitbox" type="text" maxlength="1" />
        <input class="digitbox" type="text" maxlength="1" />
        <input class="digitbox" type="text" maxlength="1" />
        <input type="hidden" name="otp" id="otp" />
      </div>
      <button class="allbuttons" id="otpsent" type="submit">Verify OTP</button>
      <a class="links" href="#" id="resendOTP">Resend OTP</a>
    </form>

    <!-- recovery pass  -->
    <!--reset   form-->
    <form id="resetpassword" class="forgetpassword">
      <h2 class="mainheadings" id="heading">Change Your Password</h2>
      <p class="oneline-para" id="para">
        Enter a new password below to change your password.
      </p>
      <label class="labels" id="label_one" for="newpassword"
        >Enter New Password</label
      >
      <input
        class="entervalue"
        id="newpassword"
        name="password"
        type="password"
        placeholder="Enter password"
        required
      />
      <br />
      <label class="labels" id="label_two" for="confirmassword"
        >Confirm Password</label
      >
      <input
        class="entervalue"
        id="confirmassword"
        name="confirm_password"
        type="password"
        placeholder="Enter Password Again"
        required
      />
      <button class="allbuttons" id="otpsent" type="submit">
        Change Password
      </button>
    </form>
    <div id="message" class="message-box"></div>
    <script>
      const passwordpage = document.getElementById("password-forget");
      const otppage = document.getElementById("OTPPAGE");
      const resetpage = document.getElementById("resetpassword");

      const message = document.getElementById("message");

      function show(page) {
        passwordpage.style.display = "none";
        otppage.style.display = "none";
        resetpage.style.display = "none";

        document.getElementById(page).style.display = "block";
      }

      // Initially show email page
      show("password-forget");

      // STEP 1: SEND OTP
      passwordpage.addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        try {
          const response = await fetch("send_otp.php", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();
          message.textContent = data.message;

          if (data.success) {
            show("OTPPAGE");
          }
        } catch (error) {
          message.textContent = "Something went wrong. Try again.";
        }
      });

      // STEP 2: COMBINE SIX OTP BOXES
      const otpBoxes = document.querySelectorAll(".digitbox");

      otpBoxes.forEach((box, index) => {
        box.addEventListener("input", function () {
          this.value = this.value.replace(/[^0-9]/g, "").slice(0, 1);

          if (this.value && index < 5) {
            otpBoxes[index + 1].focus();
          }

          document.getElementById("otp").value = Array.from(otpBoxes)
            .map((input) => input.value)
            .join("");
        });
      });

      // STEP 3: VERIFY OTP
      otppage.addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        try {
          const response = await fetch("verify_otp.php", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();
          message.textContent = data.message;

          if (data.success) {
            show("resetpassword");
          }
        } catch (error) {
          message.textContent = "Something went wrong. Try again.";
        }
      });

      // STEP 4: RESET PASSWORD
      resetpage.addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        try {
          const response = await fetch("reset_password.php", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();
          message.textContent = data.message;

          if (data.success) {
            setTimeout(function () {
              window.location.href = "login.html";
            }, 1500);
          }
        } catch (error) {
          message.textContent = "Something went wrong. Try again.";
        }
      });
    </script>
  </body>
</html>
