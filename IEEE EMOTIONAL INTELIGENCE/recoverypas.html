<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>addpassword</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <body>
    <header>
      <!-- header -->
      <div class="dbheading">
        <img src="images/logo.png" />
        <h3>Emotional Intelligence</h3>
      </div>
      <div>
        <i class="fa-sharp fa-thin fa-lightbulb"></i>
      </div>
    </header>
    <!--  form-->
    <div id="resetpassword" class="forgetpassword">
      <h2 class="mainheadings" id="heading">Change Your Password</h2>
      <p class="oneline-para" id="para">
        Enter a new password below to change your password.
      </p>
      <label class="labels" id="label_one" for="newpassword"
        >Enter New Password</label
      >
      <input
        class="entervalue"
        id="newpassword"
        type="password"
        placeholder="Enter password"
      />
      <label class="labels" id="label_two" for="confirmassword"
        >Confirm Password</label
      >
      <input
        class="entervalue"
        id="confirmassword"
        type="password"
        placeholder="Enter Password Again"
      />
      <button class="allbuttons" id="otpsent">Change Password</button>
    </div>
  </body>
</html>
