<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>welcome</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script
      src="https://kit.fontawesome.com/254f436bca.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- heading bar -->
    <header>
      <div class="dbheading">
        <img src="images/logo.png" />
        <h3>Emotional Intelligence</h3>
      </div>

      <div id="leftbar" style="display: none">
        <span id="username"></span>

        <button
          id="logoutBtn"
          style="padding: 10px; border: none; border-radius: 10px"
        >
          Logout
        </button>

        <i class="fa-solid fa-angle-left" id="toggleArrow"></i>
      </div>
    </header>
    <!--full div  -->
    <div class="allcontent">
      <!-- left wall -->
      <div class="leftwall"></div>
      <!-- welcome text -->
      <div class="welcomebox">
        <div class="introbox">
          <h1 class="welcomemsg">Welcome to Your Journey of Self-Discovery</h1>
          <p class="description">
            Enhance your self-awareness, empathy, and communication with guided
            insights.
          </p>
          <a href="login.html"
            ><button class="WELCOME">Lets Get Started</button></a
          >
        </div>
        <!-- picture -->
        <img src="images/welcme age pic.png" alt="discussion pic" />
      </div>
    </div>
    <script src=""></script>
  </body>
</html>
