<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>questionaire</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/254f436bca.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- heading bar -->
    <header>
      <div class="dbheading">
        <img src="images/logo.png" />
        <h3>EQ Lab</h3>
      </div>
      <div class="questioncount">
        <h3>
          <p id="question_count">0</p>
          of 15
        </h3>
        <div class="questionbar">
          <div class="fill"></div>
        </div>
      </div>
    </header>
    <!-- back button -->
    <a href="service.html" class="backbtn"
      ><div>
        <i class="fa-solid fa-arrow-left" id="left"></i></div
    ></a>
    <!-- mcqs cotainer -->
    <div class="mcqs">
      <h4>Unlock Your Emotional Intelligence Score</h4>
      <div class="question">
        <p id="quiz-questions"></p>
        <label
          ><input type="radio" name="q1" /><span>Strongly Disagree</span></label
        >
        <label><input type="radio" name="q1" /><span>Disagree</span></label>
        <label><input type="radio" name="q1" /><span>Neutral</span></label>
        <label><input type="radio" name="q1" /><span>Agree</span></label>
        <label
          ><input type="radio" name="q1" /><span>Strongly Agree</span></label
        >
        <div class="quiz-buttons">
          <button class="backtoold">Back</button
          ><button class="nextstatement">Next</button>
        </div>
      </div>
    </div>

    <script src="quiz.js"></script>
  </body>
</html>
